
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 동물의 숲 주민 찾기</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px 14px;
  font-family:"Malgun Gothic",sans-serif;
  background:#fff8e8;color:#51432e;text-align:center
}
.container{max-width:760px;margin:auto}
header{padding:25px 10px}
.tag{
  display:inline-block;background:#ffe8a3;
  padding:9px 17px;border-radius:30px;
  color:#85631c;font-weight:bold
}
h1{font-size:clamp(29px,6vw,42px);color:#725021;margin:20px 0 12px}
.subtitle{font-size:17px;line-height:1.8;color:#8b795d}
.panel{
  background:white;border:2px solid #f4e4bb;
  border-radius:25px;padding:24px;margin:18px 0;
  box-shadow:0 8px 20px #8b6a2d0d
}
.section-title{font-size:23px;color:#725021;margin:0 0 10px}
.description{font-size:15px;color:#95846b;margin-bottom:22px}
.grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px
}
.mbti{
  padding:15px 3px;border:2px solid #f0dfb5;
  border-radius:14px;background:#fffaf0;color:#735c37;
  font-size:17px;font-weight:bold;cursor:pointer;transition:.2s
}
.mbti:hover{background:#ffedb5;border-color:#e6bf5e;transform:translateY(-2px)}
button:focus-visible{outline:3px solid #b88728;outline-offset:3px}
.result{display:none}
.result.show{display:block;animation:appear .3s ease}
@keyframes appear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.label{
  display:inline-block;background:#fff0c2;color:#8a671f;
  padding:8px 17px;border-radius:25px;font-weight:bold
}
.image-box{
  margin:15px auto;width:min(100%,340px);height:290px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse,#fff0bd 0%,#fffaf0 70%);
  border-radius:24px;overflow:hidden
}
.character-image{width:100%;height:100%;object-fit:contain}
.image-error{display:none;color:#8b795d;padding:20px;line-height:1.8}
.character-name{font-size:34px;color:#725021;margin:8px 0}
.character-info{color:#9b7c3d;font-size:15px;margin-bottom:20px}
.reason{
  background:#fff9e9;border-radius:17px;padding:20px;
  text-align:left;font-size:17px;line-height:1.9
}
.reason h3,.compatibility h3{margin:0 0 10px;font-size:19px;color:#806023}
.reason p{margin:7px 0}
.compatibility{
  margin-top:18px;background:#fff0d9;border-radius:18px;padding:20px
}
.match{font-size:27px;font-weight:bold;color:#725021;margin:10px 0}
.compatibility p{font-size:15px;line-height:1.8;margin-bottom:0}
.action{
  margin-top:22px;padding:15px 28px;border:0;border-radius:14px;
  background:#e8b94e;color:#543b12;font-size:17px;
  font-weight:bold;cursor:pointer
}
.action:hover{background:#f0ca70}
footer{padding:24px 5px;color:#a29276;font-size:13px;line-height:1.8}
@media(max-width:480px){
  .panel{padding:19px 13px}
  .grid{gap:8px}
  .mbti{font-size:15px;padding:14px 2px}
  .image-box{height:250px}
  .reason{font-size:16px;padding:16px}
}
</style>
</head>

<body>
<main class="container">

<header>
  <div class="tag">ANIMAL CROSSING × MBTI</div>
  <h1>나와 닮은 동물의 숲 주민은?</h1>
  <p class="subtitle">
    나의 MBTI를 선택하고<br>
    나와 어울리는 동물의 숲 주민을 찾아보세요!
  </p>
</header>

<section class="panel" id="selection">
  <h2 class="section-title">나의 MBTI 선택하기</h2>
  <p class="description">16가지 유형 중 하나를 눌러주세요.</p>
  <div class="grid" id="grid"></div>
</section>

<section class="panel result" id="result" aria-live="polite">
  <div class="label" id="selected"></div>

  <div class="image-box">
    <img class="character-image" id="characterImage"
         alt="추천 동물의 숲 캐릭터 이미지">
    <p class="image-error" id="imageError">
      이미지를 불러오지 못했어요.<br>
      인터넷 연결을 확인한 뒤 다시 선택해주세요.
    </p>
  </div>

  <h2 class="character-name" id="characterName"></h2>
  <div class="character-info" id="characterInfo"></div>

  <div class="reason">
    <h3>이 주민을 추천하는 이유</h3>
    <div id="reasonText"></div>
  </div>

  <div class="compatibility">
    <h3>나와 잘 맞는 MBTI</h3>
    <div class="match" id="match"></div>
    <p id="matchReason"></p>
  </div>

  <button class="action" id="retry">다시 고르기</button>
</section>

<footer>
  캐릭터 이미지와 이름은 해당 게임의 관련 자료를 바탕으로 합니다.<br>
  MBTI별 캐릭터 추천과 궁합은 재미를 위한 창작 설정입니다.
</footer>

</main>

const types=[
 "ISTJ","ISFJ","INFJ","INTJ",
 "ISTP","ISFP","INFP","INTP",
 "ESTP","ESFP","ENFP","ENTP",
 "ESTJ","ESFJ","ENFJ","ENTJ"
];

const grid=document.getElementById("grid");
const selection=document.getElementById("selection");
const result=document.getElementById("result");
const img=document.getElementById("characterImage");
const error=document.getElementById("imageError");

types.forEach(type=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="mbti";
  button.textContent=type;
  button.addEventListener("click",()=>showResult(type));
  grid.appendChild(button);
});

function showResult(type){
  const p=data[type];

  document.getElementById("selected").textContent="나의 MBTI: "+type;
  document.getElementById("characterName").textContent=p.name;
  document.getElementById("characterInfo").textContent=
    p.en+" · "+p.kind;

  img.style.display="block";
  error.style.display="none";
  img.alt=p.name+" 캐릭터 이미지";
  img.src=p.image;

  img.onerror=function(){
    img.style.display="none";
    error.style.display="block";
  };

  const reasons=document.getElementById("reasonText");
  reasons.replaceChildren();

  p.reason.forEach(text=>{
    const para=document.createElement("p");
    para.textContent="• "+text;
    reasons.appendChild(para);
  });

  document.getElementById("match").textContent=p.match;
  document.getElementById("matchReason").textContent=p.matchReason;

  selection.style.display="none";
  result.classList.add("show");
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("retry").addEventListener("click",()=>{
  result.classList.remove("show");
  selection.style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
